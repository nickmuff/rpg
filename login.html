<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nectoflora RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid #10b981;
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(16, 185, 129, 0.2);
      text-align: center;
    }

    .login-header {
      margin-bottom: 50px;
    }

    .login-logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      display: block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .login-title {
      font-size: 36px;
      font-weight: bold;
      background: linear-gradient(135deg, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .login-subtitle {
      color: #a7f3d0;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      color: #a7f3d0;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-input {
      width: 100%;
      background: #18181b;
      border: 2px solid #27272a;
      color: #f4f1de;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      background: #1f2937;
    }

    .form-input::placeholder {
      color: #71717a;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      color: #86efac;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .success-message.show {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading {
      display: none;
      text-align: center;
      color: #a7f3d0;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #27272a;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-text {
      color: #71717a;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.6;
    }

    .footer-text a {
      color: #10b981;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-text a:hover {
      color: #34d399;
    }

    @media (max-width: 640px) {
      .login-card {
        padding: 40px 25px;
      }

      .login-title {
        font-size: 28px;
      }

      .login-logo {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <span class="login-logo">🌸</span>
        <div class="login-title">NECTOFLORA</div>
        <div class="login-subtitle">RPG System</div>
      </div>

      <!-- Mensagens -->
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <!-- Loading -->
      <div class="loading" id="login-loading">
        <span class="spinner"></span>
        Autenticando...
      </div>

      <!-- Formulário de Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">👤 Usuário</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Digite seu usuário" 
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label">🔐 Senha</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Digite sua senha" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          ⚔️ Entrar no Jogo
        </button>
      </form>

      <!-- Footer -->
      <p class="footer-text">
        Bem-vindo ao mundo de Nectoflora!<br>
        Digite suas credenciais para começar sua aventura.
      </p>
    </div>
  </div>

  <script>
    // ===== CONFIGURE AQUI =====
    // Mude o usuário e senha conforme desejar
    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "senha123";
    // ===========================

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.classList.add('show');
    }

    function clearMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    function handleLogin(event) {
      event.preventDefault();
      clearMessages();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('login-btn');
      const loginLoading = document.getElementById('login-loading');

      loginBtn.disabled = true;
      loginLoading.classList.add('show');

      // Simular delay de autenticação
      setTimeout(() => {
        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
          // Salvar no localStorage que o usuário está logado
          localStorage.setItem('nectoflora_logged', 'true');
          localStorage.setItem('nectoflora_username', username);
          
          showSuccess('✅ Login realizado com sucesso!');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showError('❌ Usuário ou senha incorretos!');
          loginBtn.disabled = false;
          loginLoading.classList.remove('show');
        }
      }, 800);
    }

    // Verificar se usuário já está logado
    window.addEventListener('load', () => {
      const isLogged = localStorage.getItem('nectoflora_logged');
      if (isLogged === 'true') {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
