<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nectoflora RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .login-card {
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid #10b981;
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(16, 185, 129, 0.2);
      text-align: center;
    }

    .login-header {
      margin-bottom: 50px;
    }

    .login-logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      display: block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .login-title {
      font-size: 36px;
      font-weight: bold;
      background: linear-gradient(135deg, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .login-subtitle {
      color: #a7f3d0;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .login-description {
      color: #a1a1aa;
      font-size: 14px;
      margin-top: 30px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .btn-google {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-google:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
    }

    .btn-google:active {
      transform: translateY(-1px);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-google i {
      font-size: 20px;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      color: #86efac;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .success-message.show {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading {
      display: none;
      text-align: center;
      color: #a7f3d0;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #27272a;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 40px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #27272a;
    }

    .divider-text {
      color: #71717a;
      padding: 0 15px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .footer-text {
      color: #71717a;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.6;
    }

    .footer-text a {
      color: #10b981;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-text a:hover {
      color: #34d399;
    }

    @media (max-width: 640px) {
      .login-card {
        padding: 40px 25px;
      }

      .login-title {
        font-size: 28px;
      }

      .login-logo {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <span class="login-logo">🌸</span>
        <div class="login-title">NECTOFLORA</div>
        <div class="login-subtitle">RPG System</div>
      </div>

      <!-- Descrição -->
      <p class="login-description">
        Bem-vindo ao mundo de Nectoflora!<br>
        Faça login com sua conta Google para começar sua aventura.
      </p>

      <!-- Mensagens -->
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <!-- Loading -->
      <div class="loading" id="login-loading">
        <span class="spinner"></span>
        Autenticando...
      </div>

      <!-- Botão Google -->
      <button onclick="loginWithGoogle()" class="btn-google" id="google-btn">
        <i class="fab fa-google"></i>
        Entrar com Google
      </button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">ou</div>
        <div class="divider-line"></div>
      </div>

      <!-- Link para Home -->
      <a href="index.html" class="block text-center text-emerald-400 hover:text-emerald-300 transition font-semibold mt-6">
        ← Voltar para o site
      </a>

      <!-- Footer -->
      <p class="footer-text">
        Ao fazer login, você concorda com nossos<br>
        <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
      </p>
    </div>
  </div>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  
  <!-- Login Script -->
  <script>
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.classList.add('show');
    }

    function clearMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    async function loginWithGoogle() {
      clearMessages();
      
      const googleBtn = document.getElementById('google-btn');
      const loginLoading = document.getElementById('login-loading');
      
      googleBtn.disabled = true;
      loginLoading.classList.add('show');

      try {
        console.log('Iniciando login com Google...');
        
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        
        console.log('Login bem-sucedido:', result.user.email);
        showSuccess('✅ Login realizado com sucesso!');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } catch (error) {
        console.error('Erro de login:', error);
        let message = 'Erro ao fazer login com Google';
        
        if (error.code === 'auth/popup-closed-by-user') {
          message = 'Login cancelado';
        } else if (error.code === 'auth/popup-blocked') {
          message = 'Pop-up foi bloqueado. Verifique as configurações do seu navegador';
        } else if (error.code === 'auth/cancelled-popup-request') {
          message = 'Requisição de login cancelada';
        }
        
        showError(message);
        googleBtn.disabled = false;
        loginLoading.classList.remove('show');
      }
    }

    // Verificar se usuário já está logado
    firebase.auth().onAuthStateChanged(user => {
      console.log('Auth state changed:', user);
      if (user) {
        console.log('Usuário já logado, redirecionando...');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
